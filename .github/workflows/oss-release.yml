name: Build and release HHVM
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested containers and a GitHub prerelease
        type: boolean
        default: false
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: hhvm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ${{ vars.HHVM_RUNNER_X86_64 || '["self-hosted","Linux","X64","hhvm"]' }}
          - arch: arm64
            platform: linux/arm64
            runner: ${{ vars.HHVM_RUNNER_ARM64 || '["self-hosted","Linux","ARM64","hhvm"]' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build, test, and package on native hardware
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bash build/release/ci_build.sh
      - name: Preserve binaries, image, and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hhvm-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn

  publish:
    name: Publish both tested architectures
    needs: build
    if: >-
      needs.build.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name != 'workflow_dispatch' && vars.HHVM_PUBLISH_CONTINUOUS == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download both successful builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: hhvm-linux-*
          path: dist
          merge-multiple: true
      - name: Enable Docker manifest tools
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Docker manifest and GitHub binary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build/release/publish.sh
